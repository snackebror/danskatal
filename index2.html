<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danske summor – kassaträning</title>
<style>
body { font-family: system-ui,sans-serif; max-width: 420px; margin: auto; padding: 2rem; text-align: center; }
#audioInfo { margin-bottom: 1.2rem; }
#startAudio { font-size: 1.3rem; padding: 0.7rem 1.1rem; }
#word { font-size: 2rem; margin: 1.5rem 0; font-weight: bold; }
.answer-row { display: flex; justify-content: center; gap: 0.8rem; }
input { font-size: 1.2rem; padding: 0.6rem; text-align: center; width: 120px; }
button { font-size: 1.1rem; padding: 0.6rem 1.1rem; }
#result { margin-top: 1rem; min-height: 1.5em; font-weight: bold; }
</style>
</head>
<body>

<div id="audioInfo">
  <button id="startAudio">🔊 Starta ljud</button>
</div>

<div id="word"></div>

<div class="answer-row">
  <input id="answer" type="text" inputmode="decimal" placeholder="Skriv summan">
  <button onclick="check()">Svar</button>
</div>

<div id="result"></div>

<script>
/* ====== Kassaspråk för danska summor ====== */
function numberToDanishCash(n) {
  const kroner = Math.floor(n);
  const ore = Math.round((n - kroner) * 100);

  const ones = ["nul","en","to","tre","fire","fem","seks","syv","otte","ni",
      "ti","elleve","tolv","tretten","fjorten","femten","seksten","sytten","atten","nitten"];
  const tens = {20:"tyve",30:"tredive",40:"fyrre",50:"halvtreds",60:"tres",70:"halvfjerds",80:"firs",90:"halvfems"};
  
  function intToWords(num) {
    if(num < 20) return ones[num];
    if(num < 100) {
      const ten = Math.floor(num/10)*10;
      const one = num%10;
      return one===0?tens[ten]:ones[one]+" og "+tens[ten];
    }
    const hundreds = Math.floor(num/100);
    const remainder = num%100;
    let text = ones[hundreds]+" hundrede";
    if(remainder>0) text += " " + intToWords(remainder);
    return text;
  }

  // Kronor
  let text = intToWords(kroner);

  // Öre enligt kassaspråk: avrunda till närmaste 5
  if(ore > 0) {
    let roundedOre = Math.round(ore/5)*5;
    if(roundedOre === 100) {
      text = intToWords(kroner+1);
    } else {
      const oreText = tens[roundedOre] || ones[roundedOre] || "";
      if(oreText) text += " og " + oreText;
    }
  }
  return text;
}

/* ====== Ljudfunktion ====== */
let audioEnabled=false;
let audioCtx=null;

function speakDanish(text){
  if(!audioEnabled||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="da-DK";
  u.rate=0.9;
  speechSynthesis.speak(u);
}

function playErrorBeep(){
  if(!audioEnabled||!audioCtx) return;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sine";
  osc.frequency.value=600;
  gain.gain.value=0.15;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+0.15);
}

document.getElementById("startAudio").addEventListener("click",()=>{
  audioEnabled=true;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const unlock=new SpeechSynthesisUtterance(" ");
  unlock.lang="da-DK";
  speechSynthesis.speak(unlock);
  document.getElementById("audioInfo").style.display="none";
  speakDanish(numberToDanishCash(current));
});

/* ====== Spel-logik ====== */
let current=null,lastAsked=null;

function getRandomNumber(){
  let n;
  do {
    n=Math.random()*999.99;
    n=Math.round(n*100)/100;
  } while(n===lastAsked);
  return n;
}

function newNumber(){
  current=getRandomNumber();
  lastAsked=current;
  document.getElementById("word").textContent = numberToDanishCash(current);
  speakDanish(numberToDanishCash(current));
  document.getElementById("answer").value="";
  document.getElementById("result").textContent="";
  document.getElementById("answer").focus();
}

function check(){
  const input=document.getElementById("answer").value.trim();
  if(input==="") return;
  const answer=parseFloat(input);

  // Avrunda current till närmaste 0.05 för kassaspråk
  const roundedCurrent = Math.round(current * 20) / 20;

  if(Math.abs(answer - roundedCurrent) < 0.01){
    document.getElementById("result").textContent="✅ Korrekt!";
  } else {
    document.getElementById("result").textContent="❌ Forkert – korrekt svar er "+roundedCurrent.toFixed(2);
    playErrorBeep();
  }
  setTimeout(newNumber,1200);
}

document.getElementById("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter") check();
});

// Starta spelet utan ljud
newNumber();
</script>

</body>
</html>
